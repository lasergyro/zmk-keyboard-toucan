[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toucan-debug"
version = "0.1.0"
description = "Debug tools for Toucan ZMK Keyboard"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5,<4",
    "pytest>=9.0.3,<10",
    "pytest-asyncio",
    "bleak", "west>=0.14.0", "keymap-drawer>=0.23.0,<0.24", "lpc-checksum>=3.0.0,<4", "pylink-square>=1.7.0,<2", "mock>=4.0.1", "ply>=3.10", "natsort>=8.4.0,<9", "pykwalify>=1.8.0,<2", "packaging>=26.2,<27", "pyyaml>=5.1", "python-magic-bin ; sys_platform == 'win32'", "graphviz>=0.21,<0.22", "pyelftools>=0.27", "clang-format>=15.0.0", "requests>=2.34.2,<3", "pyocd>=0.35.0", "grpcio-tools>=1.47.0", "cbor>=1.0.0", "windows-curses ; sys_platform == 'win32'", "pygithub>=2.9.1,<3", "canopen>=2.4.1,<3", "gcovr>=4.2", "mypy>=2.1.0,<3", "imgtool>=1.9", "tabulate>=0.10.0,<0.11", "colorama>=0.4.6,<0.5", "junitparser>=2", "pylint>=4.0.5,<5", "lxml>=6.1.1,<7", "coverage>=7.14.1,<8", "junit2html>=31.1.3,<32", "intelhex>=2.3.0,<3", "zcbor>=0.6.0", "gitlint>=0.19.1,<0.20", "yamllint>=1.38.0,<2", "progress>=1.6.1,<2", "psutil>=7.2.2,<8", "pillow>=10.0", "protobuf>=3.20.3", "anytree>=2.13.0,<3", "python-magic>=0.4.27,<0.5", "setuptools<81",
]

[project.scripts]
toucan-debug = "toucan_debug.debug_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toucan_debug*"]

[tool.pyright]
include = ["toucan_debug", "tests"]
extraPaths = [".", "tests"]
venvPath = "."
venv = ".venv"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
toucan-debug = { path = ".", editable = true }

[tool.pixi.tasks]
install-zephyr-deps = "python scripts/install_zephyr_deps.py"
