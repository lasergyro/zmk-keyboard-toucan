[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toucan-debug"
version = "0.1.0"
description = "Debug tools for Toucan ZMK Keyboard"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5,<4",
    "pytest>=9.0.3,<10",
    "pytest-asyncio",
    "bleak",
    "keymap-drawer>=0.23.0,<0.24",
]

[project.scripts]
toucan-debug = "toucan_debug.debug_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toucan_debug*"]

[tool.pyright]
include = ["toucan_debug", "tests"]
extraPaths = [".", "tests"]
venvPath = "."
venv = ".pixi/envs/default"

[tool.pixi.environments]
default = { features = ["zephyr"], solve-group = "default" }

# Zephyr dependencies are synced from the Zephyr repository's requirements.txt
[tool.pixi.feature.zephyr.pypi-dependencies]
pylint = ">=4.0.5, <5"
gcovr = ">=4.2"
ply = ">=3.10"
packaging = ">=26.2, <27"
pyelftools = ">=0.27"
intelhex = ">=2.3.0, <3"
canopen = ">=2.4.1, <3"
imgtool = ">=1.9"
grpcio-tools = ">=1.47.0"
pylink-square = ">=1.7.0, <2"
pytest = ">=9.0.3, <10"
junitparser = ">=2"
psutil = ">=7.2.2, <8"
zcbor = ">=0.6.0"
requests = ">=2.34.2, <3"
coverage = ">=7.14.1, <8"
protobuf = ">=3.20.3"
colorama = ">=0.4.6, <0.5"
pykwalify = ">=1.8.0, <2"
yamllint = ">=1.38.0, <2"
pyserial = ">=3.5, <4"
tabulate = ">=0.10.0, <0.11"
west = ">=0.14.0"
natsort = ">=8.4.0, <9"
lxml = ">=6.1.1, <7"
pyyaml = ">=5.1"
progress = ">=1.6.1, <2"
junit2html = ">=31.1.3, <32"
lpc-checksum = ">=3.0.0, <4"
mock = ">=4.0.1"
python-magic = ">=0.4.27, <0.5"
mypy = ">=2.1.0, <3"
pyocd = ">=0.35.0"
pillow = ">=10.0"
graphviz = ">=0.21, <0.22"
cbor = ">=1.0.0"
gitlint = ">=0.19.1, <0.20"
anytree = ">=2.13.0, <3"
windows-curses = { version = "*", env-markers = "sys_platform == 'win32'" }
clang-format = ">=15.0.0"
python-magic-bin = { version = "*", env-markers = "sys_platform == 'win32'" }
pygithub = ">=2.9.1, <3"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
toucan-debug = { path = ".", editable = true }
# nanopb's bundled protoc still does `import pkg_resources`, which setuptools
# removed in v81. Zephyr's requirements*.txt doesn't constrain setuptools, so
# pixi otherwise pulls the latest (82+) and the nanopb codegen step fails with
# ModuleNotFoundError: No module named 'pkg_resources'. Pin below the removal.
setuptools = "<81"

[tool.pixi.tasks]
install-zephyr-deps = "python scripts/install_zephyr_deps.py"
setup-git-hooks = "git config core.hooksPath .githooks"
