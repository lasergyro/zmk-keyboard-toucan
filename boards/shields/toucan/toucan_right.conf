CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

# Round 1 leader support defines more sequences than the upstream default of 32.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=64

# zmk-input-gestures uses floating point (circular scroll angle math) which
# requires larger stacks than the ZMK defaults.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Required to include the touchpad autosleep code.  This saves *lots* of power during use
# but IMO the user experience feels not so great because quite often when you go to use the touchpad
# you need to wait ~300ms for it to wake up.  So for now I'm leaving it off.  I think with just my 
# shutdown mode power savings are probably adequate
# CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# NOTE: SOFT_OFF is intentionally left OFF. We do NOT need it for trackpad sleep
# notifications: CONFIG_ZMK_SLEEP already selects ZMK_PM_DEVICE_SUSPEND_RESUME (which
# selects ZMK_PM), so the cirque driver's PM_DEVICE_ACTION_SUSPEND (shutdown) still runs
# when the half enters deep sleep. SOFT_OFF was previously enabled but broke matrix
# wake-up (it disables the kscan wakeup source), so it was removed. Do not re-enable
# unless you add a dedicated soft-off key + wakeup trigger. See
# plans/2026-05-29-deep-sleep-fix.md and plans/2026-06-26-right-half-sleep-investigation.md.
# CONFIG_ZMK_PM_SOFT_OFF=y
